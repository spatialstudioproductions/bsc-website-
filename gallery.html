<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Work — Black Shirt Co.</title>
  <meta name="description" content="A full showcase of work by Black Shirt Co. — POS displays, brand activations, signage, merchandise, and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* GALLERY PAGE — page-specific styles */

    .gallery-hero {
      padding: 14rem 5% 6rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .gallery-hero-headline {
      font-size: clamp(4rem, 10vw, 9rem);
      line-height: 0.88;
      text-transform: uppercase;
    }

    /* FILTER BAR */
    .gallery-filters {
      padding: 2.5rem 5%;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 0;
      background: var(--black);
      z-index: 10;
    }

    .filter-btn {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 0.5rem 1.1rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .filter-btn:hover {
      color: var(--white);
      border-color: rgba(255,255,255,0.35);
    }

    .filter-btn.active {
      color: var(--black);
      background: var(--yellow);
      border-color: var(--yellow);
    }

    /* GALLERY GRID */
    .gallery-grid {
      padding: 3rem 5% 8rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      background: var(--black);
      cursor: pointer;
      display: block;
      text-decoration: none;
    }

    .gallery-item img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .gallery-item:hover img { transform: scale(1.04); }

    .gallery-item-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(28,17,8,0.7) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.35s ease;
      display: flex;
      align-items: flex-end;
      padding: 1.5rem;
    }

    .gallery-item:hover .gallery-item-overlay { opacity: 1; }

    .gallery-item-meta {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .gallery-item-tag {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--stone);
    }

    .gallery-item-title {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--white);
    }

    /* EMPTY STATE */
    .gallery-empty {
      grid-column: 1 / -1;
      padding: 6rem 0;
      text-align: center;
      color: rgba(255,255,255,0.18);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(28,17,8,0.95);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      display: block;
      user-select: none;
    }

    .lightbox-close {
      position: absolute;
      top: 2rem;
      right: 2.5rem;
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
      z-index: 2;
    }

    .lightbox-close:hover { color: var(--white); }

    .lightbox-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      font-size: 2.5rem;
      cursor: pointer;
      padding: 1rem;
      line-height: 1;
      transition: color 0.2s;
      z-index: 2;
    }

    .lightbox-arrow:hover { color: var(--white); }
    .lightbox-arrow.prev { left: 1rem; }
    .lightbox-arrow.next { right: 1rem; }
    .lightbox-arrow.hidden { opacity: 0; pointer-events: none; }

    .lightbox-caption {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
    }

    .lightbox-caption-tag {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--stone);
      display: block;
      margin-bottom: 0.25rem;
    }

    .lightbox-caption-title {
      font-size: 0.9rem;
      color: var(--white);
    }

    .lightbox-counter {
      display: block;
      margin-top: 0.4rem;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.3);
    }

    .lightbox-video {
      max-width: 90vw;
      max-height: 80vh;
      display: none;
      outline: none;
    }

    .lightbox-video.active {
      display: block;
    }

    .lightbox-img.hidden {
      display: none;
    }

    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .play-icon::after {
      content: '';
      border-style: solid;
      border-width: 8px 0 8px 16px;
      border-color: transparent transparent transparent #fff;
      margin-left: 3px;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .gallery-hero { padding: 10rem 5% 4rem; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; padding: 2rem 5% 6rem; }
      .gallery-filters { gap: 0.5rem; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="nav" class="scrolled">
    <a href="index.html" class="nav-logo"><img src="https://res.cloudinary.com/dnl7vphpo/image/upload/v1778048351/BSC_Logo_New_evcuqa.png" alt="Black Shirt Co." /></a>
    <div class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <!-- OVERLAY MENU -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html" class="mobile-link">Home</a>
    <a href="index.html#services" class="mobile-link">Services</a>
    <a href="gallery.html" class="mobile-link">Work</a>
    <a href="index.html#about" class="mobile-link">About</a>
    <a href="https://wa.me/6597313243" class="mobile-link" target="_blank" rel="noopener">Get in Touch</a>
    <div class="menu-footer">
      <span>Black Shirt Co.</span>
      <a href="mailto:hello@wearebsc.com">hello@wearebsc.com</a>
    </div>
  </div>

  <!-- PAGE HEADER -->
  <div class="gallery-hero">
    <span class="section-label">Portfolio</span>
    <h1 class="gallery-hero-headline">Made<br>by BSC.</h1>
  </div>

  <!-- FILTER BAR -->
  <div class="gallery-filters" id="gallery-filters">
    <button class="filter-btn active" data-filter="all">All</button>
  </div>

  <!-- GALLERY GRID -->
  <div class="gallery-grid" id="gallery-grid"></div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">×</button>
    <button class="lightbox-arrow prev" id="lightbox-prev">&#8592;</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="" />
    <video class="lightbox-video" id="lightbox-video" controls playsinline></video>
    <button class="lightbox-arrow next" id="lightbox-next">&#8594;</button>
    <div class="lightbox-caption">
      <span class="lightbox-caption-tag" id="lightbox-tag"></span>
      <span class="lightbox-caption-title" id="lightbox-title"></span>
      <span class="lightbox-counter" id="lightbox-counter"></span>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <a href="index.html" class="footer-logo">
      <img src="https://res.cloudinary.com/dnl7vphpo/image/upload/v1778048351/BSC_Logo_New_evcuqa.png" alt="Black Shirt Co." />
    </a>
    <p class="footer-copy">© 2026 Black Shirt Co. All rights reserved.</p>
  </footer>

  <script>
    // NAV hamburger
    const hamburger  = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      mobileMenu.classList.toggle('open');
    });
    document.querySelectorAll('.mobile-link').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('open');
        mobileMenu.classList.remove('open');
      });
    });

    const filtersEl = document.getElementById('gallery-filters');
    const gridEl    = document.getElementById('gallery-grid');
    let allItems     = [];
    let activeFilter = 'all';

    function renderGallery(filter) {
      gridEl.innerHTML = '';
      const items = filter === 'all'
        ? allItems
        : allItems.filter(item => item.category.includes(filter));

      if (items.length === 0) {
        gridEl.innerHTML = '<div class="gallery-empty">No photos yet — check back soon.</div>';
        return;
      }

      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'gallery-item';
        el.innerHTML = `
          <img src="${item.gallery[0] || ''}" alt="${item.name}" loading="lazy" />
          ${item.videoUrl ? '<div class="play-icon"></div>' : ''}
          <div class="gallery-item-overlay">
            <div class="gallery-item-meta">
              <span class="gallery-item-tag">${item.category.join(' · ') || ''}</span>
              <span class="gallery-item-title">${item.name}</span>
            </div>
          </div>
        `;
        el.addEventListener('click', () => openLightbox(item));
        gridEl.appendChild(el);
      });
    }

    function buildFilters(items) {
      const categories = [...new Set(items.flatMap(i => i.category))].sort();
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.filter = cat;
        btn.textContent = cat;
        filtersEl.appendChild(btn);
      });
    }

    filtersEl.addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      activeFilter = btn.dataset.filter;
      filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
      renderGallery(activeFilter);
    });

    // LIGHTBOX
    const lightbox        = document.getElementById('lightbox');
    const lightboxImg     = document.getElementById('lightbox-img');
    const lightboxVideo   = document.getElementById('lightbox-video');
    const lightboxTag     = document.getElementById('lightbox-tag');
    const lightboxTitle   = document.getElementById('lightbox-title');
    const lightboxCounter = document.getElementById('lightbox-counter');
    const lightboxPrev    = document.getElementById('lightbox-prev');
    const lightboxNext    = document.getElementById('lightbox-next');

    let lbSlides = []; // each slide: { type: 'image'|'video', src }
    let lbIndex  = 0;

    function showSlide(i) {
      lbIndex = i;
      const slide = lbSlides[i];
      const total = lbSlides.length;

      if (slide.type === 'video') {
        lightboxVideo.src = slide.src;
        lightboxVideo.classList.add('active');
        lightboxImg.classList.add('hidden');
      } else {
        lightboxVideo.pause();
        lightboxVideo.src = '';
        lightboxVideo.classList.remove('active');
        lightboxImg.classList.remove('hidden');
        lightboxImg.src = slide.src;
      }

      lightboxCounter.textContent = total > 1 ? `${i + 1} / ${total}` : '';
      lightboxPrev.classList.toggle('hidden', i === 0);
      lightboxNext.classList.toggle('hidden', i === total - 1);
    }

    function openLightbox(item) {
      lbSlides = [];
      if (item.videoUrl) lbSlides.push({ type: 'video', src: item.videoUrl });
      (item.gallery || []).filter(Boolean).forEach(url => lbSlides.push({ type: 'image', src: url }));

      lightboxTag.textContent   = item.category.join(' · ') || '';
      lightboxTitle.textContent = item.name;
      showSlide(0);
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxVideo.pause();
      lightboxVideo.src = '';
      document.body.style.overflow = '';
    }

    lightboxPrev.addEventListener('click', e => { e.stopPropagation(); showSlide(lbIndex - 1); });
    lightboxNext.addEventListener('click', e => { e.stopPropagation(); showSlide(lbIndex + 1); });
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft'  && lbIndex > 0) showSlide(lbIndex - 1);
      if (e.key === 'ArrowRight' && lbIndex < lbImages.length - 1) showSlide(lbIndex + 1);
    });

    // Swipe support
    let touchStartX = 0;
    lightbox.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    lightbox.addEventListener('touchend', e => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50) {
        if (diff > 0 && lbIndex < lbImages.length - 1) showSlide(lbIndex + 1);
        if (diff < 0 && lbIndex > 0) showSlide(lbIndex - 1);
      }
    });

    // LOAD from Netlify function
    async function loadItems() {
      gridEl.innerHTML = '<div class="gallery-empty">Loading…</div>';
      try {
        const res = await fetch('/.netlify/functions/items');
        if (!res.ok) throw new Error('Failed to load');
        allItems = await res.json();
        buildFilters(allItems);
        renderGallery('all');
      } catch {
        gridEl.innerHTML = '<div class="gallery-empty">Curation coming soon.</div>';
      }
    }

    loadItems();
  </script>

</body>
</html>
