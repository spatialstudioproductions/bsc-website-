<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Work — Black Shirt Co.</title>
  <meta name="description" content="A full showcase of work by Black Shirt Co. — POS displays, brand activations, signage, merchandise, and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* GALLERY PAGE — page-specific styles */

    .gallery-hero {
      padding: 14rem 5% 6rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .gallery-hero-headline {
      font-size: clamp(4rem, 10vw, 9rem);
      line-height: 0.88;
      text-transform: uppercase;
    }

    /* FILTER BAR */
    .gallery-filters {
      padding: 2.5rem 5%;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 0;
      background: var(--black);
      z-index: 10;
    }

    .filter-btn {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 0.5rem 1.1rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .filter-btn:hover {
      color: var(--white);
      border-color: rgba(255,255,255,0.35);
    }

    .filter-btn.active {
      color: var(--black);
      background: var(--yellow);
      border-color: var(--yellow);
    }

    /* GALLERY GRID */
    .gallery-grid {
      padding: 3rem 5% 8rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      background: var(--black);
      cursor: pointer;
      display: block;
      text-decoration: none;
    }

    .gallery-item img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .gallery-item:hover img { transform: scale(1.04); }

    .gallery-item-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(28,17,8,0.7) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.35s ease;
      display: flex;
      align-items: flex-end;
      padding: 1.5rem;
    }

    .gallery-item:hover .gallery-item-overlay { opacity: 1; }

    .gallery-item-meta {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .gallery-item-tag {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--stone);
    }

    .gallery-item-title {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--white);
    }

    /* EMPTY STATE */
    .gallery-empty {
      grid-column: 1 / -1;
      padding: 6rem 0;
      text-align: center;
      color: rgba(255,255,255,0.18);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(28,17,8,0.95);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      display: block;
    }

    .lightbox-close {
      position: absolute;
      top: 2rem;
      right: 2.5rem;
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }

    .lightbox-close:hover { color: var(--white); }

    .lightbox-caption {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }

    .lightbox-caption-tag {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--stone);
      display: block;
      margin-bottom: 0.25rem;
    }

    .lightbox-caption-title {
      font-size: 0.9rem;
      color: var(--white);
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .gallery-hero { padding: 10rem 5% 4rem; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; padding: 2rem 5% 6rem; }
      .gallery-filters { gap: 0.5rem; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="nav" class="scrolled">
    <a href="index.html" class="nav-logo"><img src="https://res.cloudinary.com/dnl7vphpo/image/upload/v1778048351/BSC_Logo_New_evcuqa.png" alt="Black Shirt Co." /></a>
    <div class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <!-- OVERLAY MENU -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html" class="mobile-link">Home</a>
    <a href="index.html#services" class="mobile-link">Services</a>
    <a href="gallery.html" class="mobile-link">Work</a>
    <a href="index.html#about" class="mobile-link">About</a>
    <a href="https://wa.me/6597313243" class="mobile-link" target="_blank" rel="noopener">Get in Touch</a>
    <div class="menu-footer">
      <span>Black Shirt Co.</span>
      <a href="mailto:hello@wearebsc.com">hello@wearebsc.com</a>
    </div>
  </div>

  <!-- PAGE HEADER -->
  <div class="gallery-hero">
    <span class="section-label">Portfolio</span>
    <h1 class="gallery-hero-headline">Made<br>by BSC.</h1>
  </div>

  <!-- FILTER BAR -->
  <div class="gallery-filters" id="gallery-filters">
    <button class="filter-btn active" data-filter="all">All</button>
  </div>

  <!-- GALLERY GRID -->
  <div class="gallery-grid" id="gallery-grid"></div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">×</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="" />
    <div class="lightbox-caption">
      <span class="lightbox-caption-tag" id="lightbox-tag"></span>
      <span class="lightbox-caption-title" id="lightbox-title"></span>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <a href="index.html" class="footer-logo">
      <img src="https://res.cloudinary.com/dnl7vphpo/image/upload/v1778048351/BSC_Logo_New_evcuqa.png" alt="Black Shirt Co." />
    </a>
    <p class="footer-copy">© 2026 Black Shirt Co. All rights reserved.</p>
  </footer>

  <script src="work.js"></script>
  <script>
    // NAV hamburger
    const hamburger  = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      mobileMenu.classList.toggle('open');
    });
    document.querySelectorAll('.mobile-link').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('open');
        mobileMenu.classList.remove('open');
      });
    });

    // BUILD FILTERS & GRID from BSC_WORK
    const filtersEl = document.getElementById('gallery-filters');
    const gridEl    = document.getElementById('gallery-grid');
    let activeFilter = 'all';

    // Build filter buttons from categories
    BSC_WORK.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.dataset.filter = cat.id;
      btn.textContent = cat.label;
      filtersEl.appendChild(btn);
    });

    // Render grid
    function renderGallery(filter) {
      gridEl.innerHTML = '';
      const items = filter === 'all'
        ? BSC_WORK.flatMap(cat => cat.photos.map(p => ({ ...p, category: cat.label, id: cat.id })))
        : BSC_WORK.filter(cat => cat.id === filter).flatMap(cat => cat.photos.map(p => ({ ...p, category: cat.label, id: cat.id })));

      if (items.length === 0) {
        gridEl.innerHTML = '<div class="gallery-empty">No photos yet</div>';
        return;
      }

      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'gallery-item';

        el.innerHTML = `
          <img src="${item.src}" alt="${item.alt}" loading="lazy" />
          <div class="gallery-item-overlay">
            <div class="gallery-item-meta">
              <span class="gallery-item-tag">${item.category}</span>
              <span class="gallery-item-title">${item.alt}</span>
            </div>
          </div>
        `;

        el.addEventListener('click', () => openLightbox(item));
        gridEl.appendChild(el);
      });
    }

    // Filter button clicks
    filtersEl.addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      activeFilter = btn.dataset.filter;
      filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
      renderGallery(activeFilter);
    });

    // LIGHTBOX
    const lightbox      = document.getElementById('lightbox');
    const lightboxImg   = document.getElementById('lightbox-img');
    const lightboxTag   = document.getElementById('lightbox-tag');
    const lightboxTitle = document.getElementById('lightbox-title');

    function openLightbox(item) {
      lightboxImg.src     = item.src;
      lightboxImg.alt     = item.alt;
      lightboxTag.textContent   = item.category;
      lightboxTitle.textContent = item.alt;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    // Initial render
    renderGallery('all');
  </script>

</body>
</html>
